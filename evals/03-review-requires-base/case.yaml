schema_version: "1.1"
name: 03-review-requires-base
description: /nedflow:review without a base branch must ask for one and must not write a report.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /nedflow:review
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Agent, Write]
runs: 3
graders:
  - type: llm
    name: asks-for-base-branch
    criteria: |
      - The response asks the user which base branch to review against, or states that it cannot proceed without one.
      - It does not list review findings and does not claim that a review was performed.
  - type: file_exists
    name: no-report-written
    path: ".claude/reviews/**"
    exists: false
